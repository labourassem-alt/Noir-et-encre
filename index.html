<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOIR & ENCRE — Mes mangas</title>
<style>
:root{--bg:#0b0d14;--surface:#171b28;--surface2:#222839;--pink:#eca0b8;--fg:#f9f6fc;--muted:#b1b4c5;--line:#363c4d;--danger:#ff98a0}*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;margin:0}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--surface2);color:var(--fg);cursor:pointer}button:hover{border-color:var(--pink)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--pink);color:#1b1320;border-color:var(--pink);font-weight:750}.danger{color:var(--danger)}a{color:var(--pink)}h1,h2,h3,p{margin-top:0}h1{font-family:Georgia,serif;font-size:clamp(29px,5vw,46px)}h2{font-family:Georgia,serif}header{border-bottom:1px solid var(--line);background:#10131e;position:sticky;top:0;z-index:5}.bar{max-width:1150px;margin:auto;padding:13px 19px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:.045em;color:var(--pink);cursor:pointer}.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}main{max-width:1150px;margin:0 auto;padding:26px 19px 90px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:23px}.narrow{max-width:480px;margin:7vh auto}.muted{color:var(--muted)}.stack{display:grid;gap:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}label{display:block;font-size:13px;font-weight:700;color:#dedce9;margin-bottom:5px}input,textarea,select{background:#0d111d;color:var(--fg);border:1px solid #454a5b;border-radius:9px;padding:11px;width:100%}textarea{min-height:98px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.manga{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}.manga:hover{border-color:var(--pink)}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#2b2940}.coverEmpty{width:100%;aspect-ratio:3/4;display:grid;place-items:center;font:26px Georgia,serif;color:var(--pink);background:linear-gradient(145deg,#25263c,#4d304a)}.mangaInfo{padding:13px}.chip{border:1px solid var(--line);border-radius:100px;padding:3px 10px;font-size:12px;color:var(--muted)}.chapters{display:grid;gap:10px}.chapter{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:13px}.meter{height:7px;border-radius:30px;background:#3a3949;overflow:hidden;margin-top:8px}.meter>span{display:block;height:100%;background:var(--pink)}.alert{border:1px solid #775963;color:#ffb3bc;background:#2b1e2b;padding:11px 13px;border-radius:9px}.ok{color:#b6e4c7}.reader{max-width:880px;margin:auto}.readerFrame{background:#09090d;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px}.pageImage{display:block;margin:0 auto;max-width:100%;height:auto}.scrollPage{display:block;width:100%;height:auto;max-width:100%;margin:0 auto}.readerOptions{position:sticky;top:65px;z-index:3;background:#151928ee;border:1px solid var(--line);border-radius:12px;padding:9px;margin:14px 0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.thumbnail{width:65px;height:85px;object-fit:cover;border:1px solid var(--line);border-radius:6px}.minirow{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);padding:9px;border-radius:10px}.section{margin-top:23px}.hidden{display:none!important}.notice{border-left:3px solid var(--pink);padding:7px 13px;color:var(--muted)}.spinner{opacity:.7}.link{background:none;border:0;color:var(--pink);padding:0}.adminBadge{color:#e7d2a0}.footer{font-size:12px;color:var(--muted);text-align:center;padding:30px}.empty{padding:40px 10px;color:var(--muted);text-align:center}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.chapter{align-items:flex-start;flex-direction:column}.panel{padding:16px}.bar{padding:10px}.readerOptions{top:56px}}
</style></head><body><header><div class="bar"><div class="brand" id="homeLink">NOIR & ENCRE</div><div class="right" id="nav"></div></div></header><main id="app"><p class="muted">Chargement…</p></main><div class="footer">NOIR & ENCRE · Créations originales · Site personnel de mangas</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';
const app=document.getElementById('app'), nav=document.getElementById('nav');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ready=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('TON-PROJET')&&!SUPABASE_PUBLISHABLE_KEY.includes('TA_CLE');
const db=ready?createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
let user=null,admin=false,view='home',activeManga=null,activeChapter=null,currentPage=1,readerMode='single',allPages=[],busy=false,seq=0,scrollWatcher=null,saveTimer=null;
const errorText=e=>E(e?.message||String(e));
function notify(m,err=false){let t=document.getElementById('flash');if(!t){t=document.createElement('div');t.id='flash';t.style.cssText='position:fixed;bottom:20px;left:20px;max-width:90vw;padding:12px 18px;background:#272939;color:#fff;z-index:20;border:1px solid #8b7898;border-radius:10px;box-shadow:0 8px 30px #0009';document.body.append(t)}t.textContent=m;t.style.borderColor=err?'#e98996':'#8b7898';clearTimeout(t._timer);t._timer=setTimeout(()=>t.remove(),5000)}
function err(e){notify(e?.message||String(e),true)}
async function query(p){const {data,error}=await p;if(error)throw error;return data}
async function signed(path){if(!path)return '';const {data,error}=await db.storage.from('manga-art').createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
function title(s){return '<h1>'+E(s)+'</h1>'}
function navRender(){nav.innerHTML=user?`<span class="muted">${E(user.email)}</span><button data-action="home">Bibliothèque</button>${admin?'<button data-action="admin">Atelier admin</button>':''}<button data-action="logout">Déconnexion</button>`:''}
function goto(v){view=v;if(v!=='reader')activeChapter=null;window.scrollTo(0,0);render().catch(showError)}
function showError(e){app.innerHTML=`<div class="alert">${errorText(e)}</div><p><button id="retry">Réessayer</button></p>`;document.getElementById('retry').onclick=()=>render().catch(showError)}
async function boot(){if(!ready){app.innerHTML=`<section class="panel narrow stack"><h2>Configuration nécessaire</h2><p>Renseigne ton URL Supabase et ta clé publiable dans <code>config.js</code>, puis exécute <code>schema.sql</code> dans Supabase.</p><p class="muted">Lis le fichier README.md livré avec le site.</p></section>`;return}
 const {data:{session}}=await db.auth.getSession();user=session?.user||null;
 if(user)admin=Boolean((await query(db.from('site_admins').select('user_id').eq('user_id',user.id).maybeSingle()))?.user_id);
 db.auth.onAuthStateChange((_event,s)=>{if(s?.user?.id===user?.id)return;user=s?.user||null;admin=false;setTimeout(async()=>{try{if(user)admin=Boolean((await query(db.from('site_admins').select('user_id').eq('user_id',user.id).maybeSingle()))?.user_id);view='home';navRender();await render()}catch(e){showError(e)}},0)});
 navRender();await render()}
async function render(){if(scrollWatcher)scrollWatcher.disconnect();scrollWatcher=null;const ticket=++seq;if(!user){loginView();return}if(view==='admin'&&admin){await adminView(ticket);return}if(view==='manga'){await mangaView(ticket);return}if(view==='reader'){await readerView(ticket);return}await homeView(ticket)}
function loginView(){app.innerHTML=`<section class="panel narrow"><h1>NOIR & ENCRE</h1><p class="muted">Connecte-toi pour lire et retrouver ta progression.</p><form id="login" class="stack"><div><label>Adresse e-mail</label><input id="email" type="email" autocomplete="email" required></div><div><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="row"><button class="primary" type="submit" name="mode" value="login">Se connecter</button><button type="submit" name="mode" value="register">Créer un compte</button></div></form><p class="section"><button class="link" id="reset">Mot de passe oublié ?</button></p><p class="muted">Si Supabase impose la confirmation par e-mail, consulte ton courrier après inscription.</p></section>`;
 document.getElementById('login').onsubmit=async e=>{e.preventDefault();const mode=e.submitter?.value||'login',email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{if(mode==='register'){const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;notify(data.session?'Compte créé !':'Inscription envoyée : confirme ton adresse e-mail.')}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error}}catch(x){err(x)}};
 document.getElementById('reset').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return notify('Renseigne ton adresse e-mail.',true);try{await query(db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));notify('Si cette adresse existe, un e-mail de réinitialisation a été envoyé.')}catch(x){err(x)}}}
async function homeView(ticket){app.innerHTML='<p class="spinner">Chargement de la bibliothèque…</p>';const [mangas,progress]=await Promise.all([query(db.from('mangas').select('*').order('created_at',{ascending:false})),query(db.from('reading_progress').select('*').eq('user_id',user.id))]);if(ticket!==seq)return;
 const prog=Object.fromEntries(progress.map(x=>[x.manga_id,x]));app.innerHTML=`<div class="row spread"><div>${title('Bibliothèque')}<p class="muted">Tes histoires, tes chapitres et ta lecture au même endroit.</p></div>${admin?'<button class="primary" data-action="admin">+ Publier un manga</button>':''}</div><section class="shelf" id="shelf"></section>`;
 const shelf=document.getElementById('shelf');if(!mangas.length)shelf.innerHTML='<div class="empty">Aucun manga publié pour le moment.</div>';
 for(const m of mangas){const el=document.createElement('article');el.className='manga';el.innerHTML=`<div class="coverEmpty">${E(m.title.slice(0,20))}</div><div class="mangaInfo"><h3>${E(m.title)}</h3><p class="muted">${E(m.genre)}</p>${prog[m.id]?'<span class="chip">📖 Lecture commencée</span>':''}${!m.published?'<span class="chip">Brouillon (admin)</span>':''}</div>`;el.onclick=()=>{activeManga=m.id;goto('manga')};shelf.append(el);if(m.cover_path)signed(m.cover_path).then(url=>{const im=document.createElement('img');im.className='cover';im.src=url;im.alt='Couverture '+m.title;el.firstElementChild.replaceWith(im)}).catch(()=>{})}
}
async function mangaView(ticket){app.innerHTML='<p class="spinner">Chargement des chapitres…</p>';const [m,chapters,progress]=await Promise.all([query(db.from('mangas').select('*').eq('id',activeManga).single()),query(db.from('chapters').select('*').eq('manga_id',activeManga).order('number')),query(db.from('reading_progress').select('*').eq('user_id',user.id).eq('manga_id',activeManga).maybeSingle())]);if(ticket!==seq)return;
 app.innerHTML=`<button data-action="home">← Bibliothèque</button><section class="panel section"><h1>${E(m.title)}</h1><p class="muted">${E(m.genre)}</p><p>${E(m.synopsis)}</p>${progress?'<button id="resume" class="primary">▶ Reprendre ma lecture</button>':''}</section><section class="section"><h2>Chapitres</h2><div class="chapters" id="list"></div></section>`;
 if(progress)document.getElementById('resume').onclick=()=>{activeChapter=progress.chapter_id;goto('reader')};const list=document.getElementById('list');if(!chapters.length)list.innerHTML='<p class="muted">Les chapitres arriveront bientôt.</p>';
 for(const c of chapters){const row=document.createElement('div');row.className='chapter';row.innerHTML=`<div><b>Chapitre ${E(c.number)} — ${E(c.title)}</b><div class="muted">${!c.published?'Brouillon · ':''}${progress?.chapter_id===c.id?'Lecture en cours : page '+progress.page_number:''}</div></div><button class="primary">Lire →</button>`;row.querySelector('button').onclick=()=>{activeChapter=c.id;goto('reader')};list.append(row)} }
async function readerView(ticket){app.innerHTML='<p class="spinner">Ouverture du lecteur…</p>';const [chapter,pages,progress]=await Promise.all([query(db.from('chapters').select('*,mangas(title)').eq('id',activeChapter).single()),query(db.from('pages').select('*').eq('chapter_id',activeChapter).order('page_number')),query(db.from('reading_progress').select('*').eq('user_id',user.id).eq('manga_id',activeManga).maybeSingle())]);if(ticket!==seq)return;
 allPages=pages;currentPage=progress?.chapter_id===activeChapter?Math.max(1,Math.min(pages.length||1,progress.page_number)):1;
 app.innerHTML=`<div class="reader"><div class="row spread"><button id="backManga">← Chapitres</button><span class="chip">${E(chapter.mangas?.title)}</span></div><h2 class="section">Chapitre ${E(chapter.number)} — ${E(chapter.title)}</h2><div class="readerOptions"><button id="prev">← Précédente</button><span id="position"></span><button id="next">Suivante →</button><select id="readingMode" style="width:auto"><option value="single">Page par page</option><option value="vertical">Défilement vertical</option></select></div><div class="readerFrame" id="readingFrame"></div><div class="row spread section"><button id="prevBottom">← Page précédente</button><button id="nextBottom" class="primary">Page suivante →</button></div><p class="muted section">Ta progression est enregistrée automatiquement sur ton compte.</p></div>`;
 document.getElementById('backManga').onclick=()=>goto('manga');document.getElementById('prev').onclick=()=>turn(-1);document.getElementById('next').onclick=()=>turn(1);document.getElementById('prevBottom').onclick=()=>turn(-1);document.getElementById('nextBottom').onclick=()=>turn(1);document.getElementById('readingMode').value=readerMode;document.getElementById('readingMode').onchange=e=>{readerMode=e.target.value;drawReader()};
 if(!pages.length){document.getElementById('readingFrame').innerHTML='<p class="empty">Aucune page disponible.</p>';return}
 await drawReader();saveProgress(); }
function turn(delta){if(readerMode==='vertical'){document.querySelector(`[data-page="${Math.max(1,Math.min(allPages.length,currentPage+delta))}"]`)?.scrollIntoView({behavior:'smooth'});return}currentPage=Math.max(1,Math.min(allPages.length,currentPage+delta));drawReader();saveProgress()}
async function drawReader(){if(scrollWatcher){scrollWatcher.disconnect();scrollWatcher=null}const frame=document.getElementById('readingFrame');if(!frame)return;frame.innerHTML='<div class="empty">Chargement des images…</div>';const position=document.getElementById('position');if(position)position.textContent=`${currentPage} / ${allPages.length}`;
 if(readerMode==='single'){const p=allPages[currentPage-1];try{const url=await signed(p.image_path);if(readerMode!=='single')return;frame.innerHTML=`<img class="pageImage" alt="Page ${p.page_number}">`;frame.querySelector('img').src=url}catch(e){frame.innerHTML='<p class="alert">Impossible de charger cette page.</p>'}}
 else {const html=allPages.map(p=>`<div data-page="${p.page_number}" style="min-height:150px"><img loading="lazy" class="scrollPage" alt="Page ${p.page_number}"></div>`).join('');frame.innerHTML=html;allPages.forEach((p,i)=>signed(p.image_path).then(url=>{const el=frame.querySelectorAll('img')[i];if(el)el.src=url}).catch(()=>{}));scrollWatcher=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible){let next=Number(visible.target.dataset.page);if(next!==currentPage){currentPage=next;position.textContent=`${currentPage} / ${allPages.length}`;saveProgress()}}},{rootMargin:'-22% 0px -50% 0px',threshold:[0,.3,.6,1]});frame.querySelectorAll('[data-page]').forEach(e=>scrollWatcher.observe(e));setTimeout(()=>frame.querySelector(`[data-page="${currentPage}"]`)?.scrollIntoView(),250)} }
function saveProgress(){if(!user||!activeManga||!activeChapter||!allPages.length)return;clearTimeout(saveTimer);const m=activeManga,c=activeChapter,p=currentPage,u=user.id;saveTimer=setTimeout(async()=>{try{await query(db.from('reading_progress').upsert({user_id:u,manga_id:m,chapter_id:c,page_number:p,updated_at:new Date().toISOString()},{onConflict:'user_id,manga_id'}))}catch(e){err(e)}},350)}
async function adminView(ticket){app.innerHTML='<p>Chargement de l’atelier…</p>';const [mangas,chapters]=await Promise.all([query(db.from('mangas').select('*').order('created_at',{ascending:false})),query(db.from('chapters').select('*').order('number'))]);if(ticket!==seq)return;
 app.innerHTML=`<div class="row spread"><div>${title('Atelier administratrice')}<p class="muted">Prépare tes chapitres, vérifie leurs images, puis publie-les.</p></div><button data-action="home">Voir le site</button></div><div class="panel section"><h2>Créer un manga</h2><form id="newManga" class="stack"><div class="form-grid"><div><label>Titre</label><input name="title" maxlength="160" required></div><div><label>Genre</label><input name="genre" placeholder="Fantastique, action…"></div><div class="full"><label>Résumé</label><textarea name="synopsis"></textarea></div><div><label>Couverture (JPG, PNG, WEBP)</label><input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></div><div><label><input style="width:auto" name="published" type="checkbox"> Publier le manga</label></div></div><button class="primary" type="submit">Créer le manga</button></form></div><div class="section"><h2>Mes mangas et chapitres</h2><div id="adminMangas" class="stack"></div></div>`;
 document.getElementById('newManga').onsubmit=async e=>{e.preventDefault();const f=e.target;try{const created=await query(db.from('mangas').insert({title:f.elements.namedItem('title').value.trim(),genre:f.elements.namedItem('genre').value.trim(),synopsis:f.elements.namedItem('synopsis').value.trim(),published:f.elements.namedItem('published').checked}).select().single());if(f.elements.namedItem('cover').files[0]){const path=await upload(f.elements.namedItem('cover').files[0],`covers/${created.id}`);await query(db.from('mangas').update({cover_path:path}).eq('id',created.id))}notify('Manga créé');await render()}catch(x){err(x)}};
 const area=document.getElementById('adminMangas');if(!mangas.length)area.innerHTML='<div class="empty">Crée ton premier manga ci-dessus.</div>';
 for(const m of mangas){const sect=document.createElement('section');sect.className='panel';sect.innerHTML=`<div class="row spread"><div><h3>${E(m.title)}</h3><span class="chip">${m.published?'Publié':'Brouillon'}</span></div><div class="row"><button data-toggle>${m.published?'Dépublier le manga':'Publier le manga'}</button><button data-edit>Modifier</button><button data-delete class="danger">Supprimer</button></div></div><div class="stack section" data-chapters></div><form class="row section" data-create><input required type="number" step="0.01" min="0.01" placeholder="N° du chapitre" style="max-width:150px"><input required placeholder="Titre du chapitre" style="max-width:280px"><button class="primary" type="submit">+ Ajouter un chapitre</button></form>`;
 sect.querySelector('[data-toggle]').onclick=()=>runChange(db.from('mangas').update({published:!m.published}).eq('id',m.id),'Statut du manga modifié');
 sect.querySelector('[data-delete]').onclick=async()=>{if(!confirm(`Supprimer « ${m.title} » et tous ses chapitres ? Cette action est irréversible.`))return;await runChange(db.from('mangas').delete().eq('id',m.id),'Manga supprimé')};
 sect.querySelector('[data-edit]').onclick=()=>editManga(m);
 sect.querySelector('[data-create]').onsubmit=async e=>{e.preventDefault();const [n,t]=e.target.querySelectorAll('input');try{await query(db.from('chapters').insert({manga_id:m.id,number:Number(n.value),title:t.value.trim()}));notify('Chapitre créé en brouillon');await render()}catch(x){err(x)}};
 const list=sect.querySelector('[data-chapters]');const mine=chapters.filter(c=>c.manga_id===m.id);if(!mine.length)list.innerHTML='<p class="muted">Aucun chapitre pour le moment.</p>';
 for(const c of mine){const r=document.createElement('div');r.className='minirow';r.innerHTML=`<div><b>Chapitre ${E(c.number)} — ${E(c.title)}</b><div class="muted">${c.published?'Publié':'Brouillon'}</div></div><div class="row"><button data-pages>Gérer les pages</button><button data-publish>${c.published?'Dépublier':'Publier'}</button><button data-del class="danger">✕</button></div>`;r.querySelector('[data-pages]').onclick=()=>editChapter(c,m);r.querySelector('[data-publish]').onclick=async()=>{try{if(!c.published){const pages=await query(db.from('pages').select('id').eq('chapter_id',c.id));if(!pages.length)return notify('Ajoute au moins une page avant de publier.',true)}await runChange(db.from('chapters').update({published:!c.published}).eq('id',c.id),'Statut du chapitre modifié')}catch(x){err(x)}};
 r.querySelector('[data-del]').onclick=()=>{if(confirm('Supprimer ce chapitre et toutes ses pages ?'))runChange(db.from('chapters').delete().eq('id',c.id),'Chapitre supprimé')};list.append(r)}area.append(sect)} }
async function runChange(q,msg){try{await query(q);notify(msg);await render()}catch(x){err(x)}}
function editManga(m){app.innerHTML=`<button data-action="admin">← Atelier</button><section class="panel section"><h2>Modifier ${E(m.title)}</h2><form class="stack" id="edit"><div><label>Titre</label><input name="title" required value="${E(m.title)}"></div><div><label>Genre</label><input name="genre" value="${E(m.genre)}"></div><div><label>Résumé</label><textarea name="synopsis">${E(m.synopsis)}</textarea></div><div><label>Nouvelle couverture (facultatif)</label><input type="file" name="cover" accept="image/jpeg,image/png,image/webp"></div><button class="primary">Enregistrer</button></form></section>`;
 document.getElementById('edit').onsubmit=async e=>{e.preventDefault();const f=e.target;try{const patch={title:f.elements.namedItem('title').value.trim(),genre:f.elements.namedItem('genre').value.trim(),synopsis:f.elements.namedItem('synopsis').value.trim()};if(f.elements.namedItem('cover').files[0])patch.cover_path=await upload(f.elements.namedItem('cover').files[0],`covers/${m.id}`);await query(db.from('mangas').update(patch).eq('id',m.id));notify('Manga modifié');goto('admin')}catch(x){err(x)}}}
async function editChapter(c,m){app.innerHTML=`<button data-action="admin">← Atelier</button><div class="panel section"><h2>${E(m.title)} · Chapitre ${E(c.number)}</h2><p class="notice">Les images sont conservées sur Supabase Storage. Ajoute-les dans l'ordre voulu ; tu peux aussi supprimer et réordonner les pages.</p><form id="editChapter" class="row"><input name="title" value="${E(c.title)}" style="max-width:350px" placeholder="Titre" required><button class="primary">Enregistrer le titre</button></form><section class="section"><h3>Ajouter des pages</h3><input type="file" id="files" accept="image/png,image/jpeg,image/webp" multiple><button class="primary section" id="addPages">Importer les images sélectionnées</button><p class="muted">Sélectionne toutes les pages, avec des noms numérotés (001.png, 002.png…). Taille maximale : 15 Mo par image.</p></section><section class="section"><h3>Pages du chapitre</h3><div class="stack" id="adminPages">Chargement…</div></section></div>`;
 document.getElementById('editChapter').onsubmit=async e=>{e.preventDefault();try{await query(db.from('chapters').update({title:e.target.elements.namedItem('title').value.trim()}).eq('id',c.id));notify('Titre modifié')}catch(x){err(x)}};
 document.getElementById('addPages').onclick=async()=>{const files=[...document.getElementById('files').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length)return notify('Choisis des images.',true);const button=document.getElementById('addPages');button.disabled=true;try{const prior=await query(db.from('pages').select('page_number').eq('chapter_id',c.id).order('page_number',{ascending:false}).limit(1));let n=prior[0]?.page_number||0;for(const file of files){button.textContent=`Import ${++n}…`;const path=await upload(file,`pages/${c.id}`);await query(db.from('pages').insert({chapter_id:c.id,page_number:n,image_path:path}))}notify(`${files.length} pages ajoutées`);await editChapter(c,m)}catch(x){err(x)}finally{button.disabled=false;button.textContent='Importer les images sélectionnées'}};
 await loadAdminPages(c,m)}
async function loadAdminPages(c,m){const pages=await query(db.from('pages').select('*').eq('chapter_id',c.id).order('page_number'));const area=document.getElementById('adminPages');if(!area)return;area.innerHTML='';if(!pages.length)area.innerHTML='<p class="muted">Ce chapitre ne contient pas encore de pages.</p>';
 for(let i=0;i<pages.length;i++){const p=pages[i],el=document.createElement('div');el.className='minirow';el.innerHTML=`<div class="row"><img class="thumbnail" alt="Page ${p.page_number}"><b>Page ${p.page_number}</b></div><div class="row"><button data-up ${i===0?'disabled':''}>↑</button><button data-down ${i===pages.length-1?'disabled':''}>↓</button><button data-del class="danger">Supprimer</button></div>`;signed(p.image_path).then(u=>el.querySelector('img').src=u).catch(()=>{});el.querySelector('[data-del]').onclick=async()=>{if(!confirm('Supprimer cette page ?'))return;try{await query(db.from('pages').delete().eq('id',p.id));await normalizePages(c.id);notify('Page supprimée');loadAdminPages(c,m)}catch(e){err(e)}};
 el.querySelector('[data-up]').onclick=()=>swapPages(p,pages[i-1],c,m);el.querySelector('[data-down]').onclick=()=>swapPages(p,pages[i+1],c,m);area.append(el)} }
// Échange via numéros temporaires > 1 000 000, pour respecter UNIQUE(chapter_id,page_number).
async function swapPages(a,b,c,m){try{const temp=1000000+Math.floor(Math.random()*1000000);await query(db.from('pages').update({page_number:temp}).eq('id',a.id));await query(db.from('pages').update({page_number:a.page_number}).eq('id',b.id));await query(db.from('pages').update({page_number:b.page_number}).eq('id',a.id));await loadAdminPages(c,m)}catch(e){err(e)}}
async function normalizePages(chapterId){const pages=await query(db.from('pages').select('id,page_number').eq('chapter_id',chapterId).order('page_number'));for(let i=0;i<pages.length;i++)await query(db.from('pages').update({page_number:1000000+i}).eq('id',pages[i].id));for(let i=0;i<pages.length;i++)await query(db.from('pages').update({page_number:i+1}).eq('id',pages[i].id))}
async function upload(file,prefix){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Formats acceptés : JPG, PNG, WEBP');if(file.size>15*1024*1024)throw Error('Chaque image doit faire au plus 15 Mo');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`${prefix}/${crypto.randomUUID()}.${ext}`;await query(db.storage.from('manga-art').upload(path,file,{contentType:file.type,upsert:false}));return path}
nav.addEventListener('click',async e=>{const k=e.target.closest('[data-action]')?.dataset.action;if(k==='logout'){try{await query(db.auth.signOut());user=null;admin=false;goto('home')}catch(x){err(x)}}if(k==='home'||k==='admin')goto(k)});
app.addEventListener('click',e=>{const k=e.target.closest('[data-action]')?.dataset.action;if(k==='home'||k==='admin')goto(k)});
document.getElementById('homeLink').onclick=()=>goto('home');
document.addEventListener('keydown',e=>{if(view!=='reader'||readerMode!=='single'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});
boot().catch(showError);
</script></body></html>
